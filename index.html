<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CiberEscape — Centro de Comando</title>
<meta name="description" content="Escape room de ciberseguridad: cinco desafíos (hashes, CVE, Base64, CWE y fallos de configuración) resueltos investigando la propia web.">
<meta property="og:title" content="CiberEscape — Un Fantasma en el Sistema">
<meta property="og:description" content="Escape room de ciberseguridad en el navegador: cinco códigos, técnicas reales.">
<meta property="og:image" content="https://unfantasmaenelsistema.github.io/CiberEscape/icono.png">
<link rel="icon" type="image/png" href="icono.png">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
  (function () {
    var t = null; try { t = localStorage.getItem('ce_theme'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>

<header class="brandbar">
  <a class="brand" href="https://www.unfantasmaenelsistema.com" target="_blank" rel="noopener">
    <img src="icono.png" alt="Un Fantasma en el Sistema" width="40" height="40">
    <span><b>CIBERESCAPE</b><small data-t="brandSub">UN FANTASMA EN EL SISTEMA</small></span>
  </a>
  <nav class="controls">
    <a class="chip" href="https://www.unfantasmaenelsistema.com" target="_blank" rel="noopener">WEB</a>
    <button class="chip" id="langBtn" type="button">EN</button>
    <button class="chip" id="themeBtn" type="button">☀</button>
  </nav>
</header>

<main class="window">
  <div class="titlebar"><span data-t="winTitle">Escapar.exe — Módulo de validación</span><span class="dots"><span></span><span></span><span></span></span></div>
  <div class="content">
    <h1 data-t="h1">Prueba del analista</h1>
    <p class="lead" data-t="lead"></p>

    <a href="hash_cracker.html" class="btn blue" data-t="openCracker">🛠️ Abrir la herramienta de cracking</a>

    <div class="progress" id="progress" aria-hidden="true"></div>
    <div class="meta"><span id="progressText"></span><span id="timeText"></span><span id="hintsText"></span></div>

    <section id="play">
      <div class="card">
        <div class="label" data-t="current">Desafío actual</div>
        <div class="title" id="chTitle"></div>
        <p class="clue" id="chClue"></p>
        <p class="extra" id="chExtra" hidden></p>
        <button class="btn ghost" id="hintBtn" type="button" data-t="showHint">Mostrar pista extra</button>
      </div>

      <label for="codeInput" data-t="inputLabel">Introduce el código de validación:</label>
      <input type="text" id="codeInput" class="upper" placeholder="CÓDIGO_A_VALIDAR" autocomplete="off" spellcheck="false">
      <button class="btn" id="validateBtn" type="button" data-t="validate">Validar código</button>
      <div id="message" class="msg" aria-live="polite">&nbsp;</div>
    </section>

    <section id="done" hidden>
      <div class="card">
        <div class="title" data-t="doneTitle">¡HAS ESCAPADO!</div>
        <p id="doneText"></p>
        <div class="flag" id="flag"></div>
      </div>
    </section>

    <button class="btn ghost" id="resetBtn" type="button" data-t="reset">Reiniciar la partida</button>
  </div>
</main>

<footer>
  <span data-t="footer"></span>
  <span class="links">
    <a href="https://ghostore.unfantasmaenelsistema.com/" target="_blank" rel="noopener">GhoStore</a>
    <a href="https://github.com/unfantasmaenelsistema/CiberEscape" target="_blank" rel="noopener" data-t="source">Código fuente</a>
    <a href="https://github.com/unfantasmaenelsistema/CiberEscape/blob/main/writeup/WRITEUP.md" target="_blank" rel="noopener" data-t="writeup">Writeup (spoilers)</a>
  </span>
</footer>

<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="js/telemetry.js"></script>
<script src="js/game.js"></script>
</body>

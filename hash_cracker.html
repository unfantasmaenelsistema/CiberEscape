<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CiberEscape — Herramienta de cracking MD5</title>
<link rel="icon" type="image/png" href="icono.png">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
  (function () {
    var t = null; try { t = localStorage.getItem('ce_theme'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>

<header class="brandbar">
  <a class="brand" href="https://www.unfantasmaenelsistema.com" target="_blank" rel="noopener">
    <img src="icono.png" alt="Un Fantasma en el Sistema" width="40" height="40">
    <span><b>CIBERESCAPE</b><small data-t="brandSub">UN FANTASMA EN EL SISTEMA</small></span>
  </a>
  <nav class="controls">
    <a class="chip" href="https://www.unfantasmaenelsistema.com" target="_blank" rel="noopener">WEB</a>
    <button class="chip" id="langBtn" type="button">EN</button>
    <button class="chip" id="themeBtn" type="button">☀</button>
  </nav>
</header>

<main class="window">
  <div class="titlebar"><span data-t="crackerWin">Herramienta_MD5.exe — Descifrador de hash</span><span class="dots"><span></span><span></span><span></span></span></div>
  <div class="content">
    <h1 data-t="crackerH1">Descifrador de hash MD5</h1>
    <p class="lead" data-th="crackerLead"></p>

    <label for="targetHash" data-t="targetLabel">Hash MD5 objetivo:</label>
    <input type="text" id="targetHash" class="upper" data-tp="targetPh" autocomplete="off" spellcheck="false" maxlength="40">

    <div class="card">
      <div class="title" data-t="dictTitle">Ataque de diccionario</div>
      <p id="dictText"></p>
      <button class="btn red" id="dictBtn" type="button" data-t="runDict">▶ Lanzar ataque de diccionario</button>
      <div class="log" id="log" aria-live="off"></div>
    </div>

    <label for="wordToTest" data-t="wordLabel">Probar una palabra concreta:</label>
    <div class="row">
      <input type="text" id="wordToTest" data-tp="wordPh" autocomplete="off" spellcheck="false">
    </div>
    <button class="btn" id="tryBtn" type="button" data-t="tryWord">Probar palabra</button>

    <div id="message" class="msg" aria-live="polite">&nbsp;</div>

    <a class="btn ghost" href="index.html" data-t="back">← Volver al centro de comando</a>
  </div>
</main>

<footer>
  <span data-t="footer"></span>
  <span class="links">
    <a href="https://ghostore.unfantasmaenelsistema.com/" target="_blank" rel="noopener">GhoStore</a>
    <a href="https://github.com/unfantasmaenelsistema/CiberEscape" target="_blank" rel="noopener" data-t="source">Código fuente</a>
  </span>
</footer>

<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="js/md5.js"></script>
<script src="js/cracker.js"></script>
</body>
</html>
